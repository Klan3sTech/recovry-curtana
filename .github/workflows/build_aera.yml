name: Build AERA Recovery for Miatoll

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal Manifest Branch'
        required: true
        default: 'twrp-12.1'

jobs:
  build:
    name: Compile Recovery Image
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 4096
        temp-reserve-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Set up Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip \
          curl zlib1g-dev libc6-dev-i386 libncurses5 libssl-dev libxml2-utils \
          xsltproc unzip python3 rsync bc ccache

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize TWRP Manifest
      run: |
        mkdir -p ${{ github.workspace }}/work
        cd ${{ github.workspace }}/work
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone AERA Source and Device Tree
      run: |
        cd ${{ github.workspace }}/work
        
        # Заменяем стандартный TWRP на AERA Recovery
        rm -rf bootable/recovery
        git clone https://github.com/AERA-Recovery/android_bootable_recovery.git bootable/recovery --depth=1

        # Клонируем дерево устройства OrangeFox для miatoll
        mkdir -p device/xiaomi/curtana
        git clone https://github.com/OrangeFoxRecovery/device_xiaomi_miatoll.git device/xiaomi/curtana --depth=1

    - name: Patch AERA and Adapt Device Tree
      run: |
        cd ${{ github.workspace }}/work
        
        # 1. Патчим AERA для совместимости с Soong Android 12.1:
        # Удаляем строки default_team и отключаем тесты/шрифты, требующие Soong A14
        find bootable/recovery -name "Android.bp" -exec sed -i '/default_team/d' {} +
        find bootable/recovery -name "Android.bp" -exec sed -i '/prebuilt_res/,/}/d' {} +
        
        # Отключаем ненужные тестовые подпапки из главного Android.bp
        sed -i 's/"tests",//g' bootable/recovery/Android.bp 2>/dev/null || true
        sed -i 's/"updater_sample",//g' bootable/recovery/Android.bp 2>/dev/null || true

        # 2. Настраиваем дерево устройства
        cd device/xiaomi/curtana
        echo "#!/bin/bash" > vendorsetup.sh
        chmod 755 vendorsetup.sh

        # Создаем twrp_curtana.mk
        cat << 'EOF' > twrp_curtana.mk
        $(call inherit-product, $(SRC_TARGET_DIR)/product/aosp_base.mk)
        $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
        $(call inherit-product, device/xiaomi/curtana/device.mk)

        PRODUCT_NAME := twrp_curtana
        PRODUCT_DEVICE := curtana
        PRODUCT_BRAND := Xiaomi
        PRODUCT_MODEL := Redmi Note 9S
        PRODUCT_MANUFACTURER := Xiaomi
        EOF

        # Регистрируем таргет
        cat << 'EOF' > AndroidProducts.mk
        PRODUCT_MAKEFILES := \
            $(LOCAL_DIR)/twrp_curtana.mk

        COMMON_LUNCH_CHOICES := \
            twrp_curtana-eng
        EOF

        # Нейтрализуем флаги OrangeFox
        sed -i 's/^OF_/# OF_/g' BoardConfig.mk 2>/dev/null || true
        sed -i 's/^TW_OFOX_/# TW_OFOX_/g' BoardConfig.mk 2>/dev/null || true

    - name: Build Recovery Image
      run: |
        cd ${{ github.workspace }}/work
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_curtana-eng
        mka recoveryimage -j$(nproc --all)

    - name: Verify and Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AERA-Miatoll-Recovery
        path: ${{ github.workspace }}/work/out/target/product/curtana/recovery.img
        if-no-files-found: error
        
