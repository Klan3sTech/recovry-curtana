name: Build AERA Recovery for Miatoll

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal Manifest Branch'
        required: true
        default: 'twrp-12.1'

jobs:
  build:
    name: Compile Recovery Image
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 4096
        temp-reserve-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Set up Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip \
          curl zlib1g-dev libc6-dev-i386 libncurses5 libssl-dev libxml2-utils \
          xsltproc unzip python3 rsync bc ccache ncurses-term

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize TWRP Manifest
      run: |
        mkdir -p ${{ github.workspace }}/work
        cd ${{ github.workspace }}/work
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone AERA Source and Device Tree
      run: |
        cd ${{ github.workspace }}/work
        
        # 1. Сохраняем чистый libtar из TWRP 12.1
        mkdir -p /tmp/twrp_libtar
        cp -r bootable/recovery/libtar /tmp/twrp_libtar/ 2>/dev/null || true

        # 2. Клонируем AERA Recovery
        rm -rf bootable/recovery
        git clone https://github.com/AERA-Recovery/android_bootable_recovery.git bootable/recovery --depth=1

        # 3. Клонируем официальный LVGL v8.3
        rm -rf external/lvgl
        git clone --depth=1 -b release/v8.3 https://github.com/lvgl/lvgl.git external/lvgl
        cat << 'EOF' > external/lvgl/Android.bp
        cc_library_static {
            name: "liblvgl_recovery",
            recovery_available: true,
            srcs: [
                "src/**/*.c",
            ],
            cflags: [
                "-Wno-unused-parameter",
                "-Wno-missing-field-initializers",
            ],
            export_include_dirs: ["."],
        }
        EOF

        # 4. Восстанавливаем проверенный libtar
        if [ -d /tmp/twrp_libtar/libtar ]; then
          rm -rf bootable/recovery/libtar
          cp -r /tmp/twrp_libtar/libtar bootable/recovery/
        fi

        # 5. Клонируем дерево устройства OrangeFox для miatoll
        rm -rf device/xiaomi/curtana
        mkdir -p device/xiaomi/curtana
        git clone https://github.com/OrangeFoxRecovery/device_xiaomi_miatoll.git device/xiaomi/curtana --depth=1

    - name: Patch AERA and Adapt Device Tree
      run: |
        cd ${{ github.workspace }}/work
        
        # 1. ЗАГЛУШКА ДЛЯ ТЕСТОВ SOONG
        if [ -f build/blueprint/gotestrunner/gotestrunner.go ]; then
          cat << 'EOF' > build/blueprint/gotestrunner/gotestrunner.go
        package main
        import (
            "os"
            "path/filepath"
        )
        func main() {
            args := os.Args[1:]
            for i := 0; i < len(args); i++ {
                if args[i] == "-f" && i+1 < len(args) {
                    outFile := args[i+1]
                    os.MkdirAll(filepath.Dir(outFile), 0755)
                    f, err := os.Create(outFile)
                    if err == nil {
                        f.Close()
                    }
                    break
                }
            }
            os.Exit(0)
        }
        EOF
        fi

        # 2. Нейтрализуем директивы $(error ...) в aera_build.mk
        if [ -f bootable/recovery/aera_build.mk ]; then
          sed -i 's/\$(error/\$(warning/g' bootable/recovery/aera_build.mk
        fi

        # 3. Удаляем свойства Android 14+ из всех Android.bp recovery и external/lvgl
        find bootable/recovery external/lvgl -name "Android.bp" -exec sed -i '/default_team/d' {} + 2>/dev/null || true
        
        # 4. Очищаем fonts/Android.bp от несовместимого prebuilt_res
        if [ -f bootable/recovery/fonts/Android.bp ]; then
          echo "// Cleared for A12.1 build" > bootable/recovery/fonts/Android.bp
        fi

        # 5. Отключаем модуль aera-fingerprint
        if [ -f bootable/recovery/aeraui/Android.bp ]; then
          sed -i '/name: "aera-fingerprint"/a \    enabled: false,' bootable/recovery/aeraui/Android.bp
        fi

        # 6. Убираем модуль external/se_omapi
        if [ -f bootable/recovery/prebuilt/Android.bp ]; then
          sed -i '/external\/se_omapi/d' bootable/recovery/prebuilt/Android.bp
        fi

        # 7. Отключаем тестовые директории в recovery
        sed -i 's/"tests",//g' bootable/recovery/Android.bp 2>/dev/null || true
        sed -i 's/"updater_sample",//g' bootable/recovery/Android.bp 2>/dev/null || true

        # 8. Вырезаем все упоминания NDK и A/B-библиотек из recovery
        find bootable/recovery -type f \( -name "Android.bp" -o -name "Android.mk" \) -exec sed -i -E 's/"[^"]*-ndk(_platform)?",?//g' {} + 2>/dev/null || true
        find bootable/recovery -type f \( -name "Android.bp" -o -name "Android.mk" \) -exec sed -i -E 's/[a-zA-Z0-9._-]+-ndk(_platform)?//g' {} + 2>/dev/null || true
        find bootable/recovery -type f \( -name "Android.bp" -o -name "Android.mk" \) -exec sed -i '/health-translate/d' {} + 2>/dev/null || true
        find bootable/recovery -type f \( -name "Android.bp" -o -name "Android.mk" \) -exec sed -i '/libboot_control_client/d' {} + 2>/dev/null || true

        # 9. Удаляем зависимость libjpeg из recovery
        find bootable/recovery -type f \( -name "Android.bp" -o -name "Android.mk" \) -exec sed -i -E 's/"libjpeg(-turbo)?",?//g' {} + 2>/dev/null || true
        find bootable/recovery -type f \( -name "Android.bp" -o -name "Android.mk" \) -exec sed -i -E 's/\blibjpeg(-turbo)?\b//g' {} + 2>/dev/null || true

        # 10. Удаляем зависимость libhealthshim из recovery
        find bootable/recovery -type f \( -name "Android.bp" -o -name "Android.mk" \) -exec sed -i -E 's/"libhealthshim",?//g' {} + 2>/dev/null || true
        find bootable/recovery -type f \( -name "Android.bp" -o -name "Android.mk" \) -exec sed -i -E 's/\blibhealthshim\b//g' {} + 2>/dev/null || true

        # 11. Подготовка полной базы terminfo прямо в дерево пребилдов и ramdisk
        mkdir -p device/xiaomi/curtana/terminfo
        if [ -d /lib/terminfo ]; then
          cp -r /lib/terminfo/* device/xiaomi/curtana/terminfo/ 2>/dev/null || true
        elif [ -d /usr/share/terminfo ]; then
          cp -r /usr/share/terminfo/* device/xiaomi/curtana/terminfo/ 2>/dev/null || true
        fi

        # 12. Настраиваем дерево устройства miatoll
        cd device/xiaomi/curtana
        echo "#!/bin/
